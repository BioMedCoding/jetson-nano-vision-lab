# Canonical class list for fine-tuning, plus a source-name -> canonical-id
# map for every dataset the builder (cvtrain/dataset_builder.py) supports.
#
# The 80 canonical classes are the official COCO-2017 ones, in the same id
# order as yolov5's data/coco.yaml. The pretrained weights are trained on
# exactly this scheme, so fine-tuning starts with an advantage: most classes
# already have a sensible representation and training only specializes them
# to the real camera scene instead of learning them from scratch.
#
# Why these 80 and no more: the value of fine-tuning here is not covering
# more classes but being more accurate on the real scene (a person was seen
# being taken for a cat), so staying on COCO's native classes maximizes both
# useful coverage and transfer-learning quality. Indoor home + garden/street
# scenes, no wildlife.
#
# Sources (mappings checked programmatically, not assumed):
#   - Sama-COCO: EXACT 1:1 match with all 80 COCO names (same images).
#   - Open Images V7: 601 classes with its own naming, often different from
#     COCO ("tv" -> "Television", "cow" -> "Cattle"). 78/80 classes mapped to
#     a reasonable equivalent checked against
#     fiftyone.utils.openimages.get_classes(); frisbee and cup have no direct
#     enough OIV7 equivalent, so they come from samacoco only (a source
#     without a mapping for a class simply drops that class).
#
# To add or remove classes: edit canonical_classes and both source maps
# consistently; a canonical class missing from a source is dropped from it.

