# Lista di classi canoniche per il fine-tuning + mapping nome-sorgente -> id
# canonico per ogni dataset supportato dal builder.
#
# Le 80 classi canoniche sono le classi COCO-2017 ufficiali (stesso ordine
# id di yolov5/data/coco.yaml -- i pesi pretrained gia' usati sono allenati
# su questo esatto schema, quindi il fine-tuning riparte da un vantaggio: la
# maggior parte delle classi ha gia' un embedding sensato, il training deve
# solo specializzarle sulla scena reale invece di impararle da zero).
#
# Copertura scelta in sessione (2026-07-19): interni domestici + esterni
# giardino/strada, nessuna fauna selvatica (volpe rimossa su richiesta
# esplicita -- non serve). Motivazione: i pesi COCO pretrained gia' usati
# sono generici a 80 classi; il valore del fine-tuning qui non e' "coprire
# piu' classi" ma migliorare l'accuratezza sulla scena reale della camera
# (osservato un caso di persona confusa con gatto), quindi restare sulle 80
# classi COCO native massimizza sia la copertura utile sia la qualita' del
# transfer learning.
#
# Sorgenti verificate in sessione (non assunte):
#   - Sama-COCO: match ESATTO 1:1 con tutti gli 80 nomi COCO (stessa origine
#     dati, verificato programmaticamente con fiftyone.zoo).
#   - Open Images V7: 601 classi con nomenclatura propria, spesso diversa da
#     COCO (es. "cup"->nessun match diretto, "tv"->"Television",
#     "cow"->"Cattle"). Mappate 78/80 classi con un equivalente ragionevole
#     verificato contro fiftyone.utils.openimages.get_classes(); 2 classi
#     (frisbee, cup) NON hanno un equivalente OIV7 sufficientemente diretto
#     da fidarsene -- per queste due, il dataset arriva solo da samacoco
#     (comportamento gia' gestito: una sorgente senza mapping per una classe
#     la scarta silenziosamente per quella sorgente, non fallisce).
#
# Per aggiungere/togliere classi in futuro: modifica canonical_classes e le
# due mappe sources coerentemente; una classe canonica senza voce in una
# sorgente viene semplicemente scartata da quella sorgente al remap.

